# SIGMA — stack completo para Coolify (PostGIS + API + Web).
# Um unico recurso Docker Compose no Coolify; deploy automatico via Git.
#
# IMPORTANTE (Coolify):
# - POSTGRES_* devem existir no .env do compose (Buildtime) para interpolar DATABASE_URL.
# - NAO liste JWT_SECRET / INITIAL_ADMIN_PASSWORD / outros segredos aqui com ${VAR:-}:
#   se a var nao estiver no .env de interpolacao, vira "" e SOBRESCREVE a injecao runtime.
# - Segredos: so no Environment Coolify (runtime). Veja COOLIFY.md e .env.coolify.example

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestop_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gestop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-gestop} -d ${POSTGRES_DB:-gestop}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Coolify/Docker: bind IPv4 para o healthcheck em 127.0.0.1 funcionar
      HOST: 0.0.0.0
      PORT: 3001
      COOLIFY: 'true'
      # POSTGRES_* precisam estar no .env de interpolacao do compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestop}:${POSTGRES_PASSWORD:-gestop_change_me}@postgres:5432/${POSTGRES_DB:-gestop}?schema=public
      # JWT_SECRET e INITIAL_ADMIN_PASSWORD: NAO definir aqui — so injecao Coolify (runtime).
      # ${JWT_SECRET:-} vazio sobrescreve o segredo real e a API sai em ~2s.
      CORS_ORIGINS: ${CORS_ORIGINS:-${SERVICE_URL_WEB:-http://localhost:3000}}
      RUN_SEED: ${RUN_SEED:-false}
      FORCE_SEED_ON_START: ${FORCE_SEED_ON_START:-false}
      FORCE_DB_RESET: ${FORCE_DB_RESET:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/gestop-evidencias}
      STORAGE_PUBLIC_URL_BASE: ${STORAGE_PUBLIC_URL_BASE:-${SERVICE_URL_WEB:-http://localhost:3000}/api-gestop}
      STORAGE_MAX_FILE_BYTES: ${STORAGE_MAX_FILE_BYTES:-26214400}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-${SERVICE_URL_WEB:-http://localhost:3000}}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-${SERVICE_URL_WEB:-http://localhost:3000}}
      # false no 1o boot: mais rapido e menos superficie de falha; ative depois se quiser
      WEBMAP_AUTO_IMPORT_ON_START: ${WEBMAP_AUTO_IMPORT_ON_START:-false}
      WEBMAP_AUTO_IMPORT_MIN_UNITS: ${WEBMAP_AUTO_IMPORT_MIN_UNITS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      INTEGRACOES_WEBHOOK_URL: ${INTEGRACOES_WEBHOOK_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-sigma-backups}
      ALERTAS_INTERVAL_MS: ${ALERTAS_INTERVAL_MS:-21600000}
      SYNC_REPLAY_INTERVAL_MS: ${SYNC_REPLAY_INTERVAL_MS:-1800000}
      LGPD_AUDIT_RETENTION_DAYS: ${LGPD_AUDIT_RETENTION_DAYS:-365}
      # Segredos (S3 keys, VAPID, WEBHOOK_SECRET, BACKUP_ENCRYPTION_KEY, WEBMAP_CRON_SECRET):
      # so via Environment Coolify — nao listar com ${VAR:-} (override vazio).
    volumes:
      - api_storage:/data/gestop-evidencias
    healthcheck:
      # node fetch (Node 20) — imagem bookworm-slim nao inclui wget/curl
      # start_period alto: migrate + seed + eventual webmap antes do Nest ouvir
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    expose:
      - '3001'

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # service_started: web sobe mesmo se a API crashar; /api/health/backend mostra o status
    # healthcheck da api permanece para ops (nao bloqueia o web)
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:3001}
      NEXT_PUBLIC_SHOW_DEMO_LOGIN: ${NEXT_PUBLIC_SHOW_DEMO_LOGIN:-false}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - '3000'

volumes:
  pgdata:
  api_storage:
