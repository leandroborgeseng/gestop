# Coolify / Railway / Nixpacks — Next.js 16 (Node >=20.9)
# Produção usa standalone (não depende do binário `next` no PATH).

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node .next/standalone/server.js"

[variables]
HOSTNAME = "0.0.0.0"
NEXT_TELEMETRY_DISABLED = "1"
