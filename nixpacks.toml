# Railway/Nixpacks — backend SIGMA requer Node 20+ (Prisma 7, NestJS 11)

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

[variables]
# 296: limita arenas do malloc e devolve memória ao SO (pico da importação de camadas < 300 MB)
MALLOC_ARENA_MAX = "2"
MALLOC_TRIM_THRESHOLD_ = "131072"
