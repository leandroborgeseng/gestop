name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-db:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do serviço do CI (nome com _test); nada de produção.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestop_test
      ESCOPO_306_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestop_test
      WEBMAP_CAMADAS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestop_webmap_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cria o banco do webmap (_test)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE gestop_webmap_test"
      - name: Migrações nos bancos _test
        run: |
          npx prisma migrate deploy
          DATABASE_URL="$WEBMAP_CAMADAS_TEST_DATABASE_URL" npx prisma migrate deploy
      - name: db.spec (sem paralelismo entre arquivos)
        run: npm run test:db
